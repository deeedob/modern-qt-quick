version = 1

[[annotations]]
path = [
    ".gitmodules",
    "CMakePresets.json",
    "vcpkg.json",
    "vcpkg-configuration.json",
    "i18n/**",
    "packaging/app.icns",
    "packaging/app.ico",
    "packaging/app.svg",
]
SPDX-FileCopyrightText = "2026 Dennis Oberst"
SPDX-License-Identifier = "MIT-0"

[[annotations]]
path = "src/frontend/ui/fonts/InterVariable.ttf"
SPDX-FileCopyrightText = "2020 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Lucide icons; the ones derived from Feather also carry Feather's MIT license.
[[annotations]]
path = [
    "src/frontend/ui/icons/info.svg",
    "src/frontend/ui/icons/plus.svg",
    "src/frontend/ui/icons/trash.svg",
]
SPDX-FileCopyrightText = ["2026 Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"

[[annotations]]
path = [
    "src/frontend/ui/icons/languages.svg",
    "src/frontend/ui/icons/pause.svg",
    "src/frontend/ui/icons/play.svg",
    "src/frontend/ui/icons/rotate-ccw.svg",
]
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"

# GPL and LGPL texts shipped with the application, as Qt's LGPLv3 license requires.
[[annotations]]
path = "packaging/licenses/*.txt"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "LicenseRef-FSF-verbatim"
