# Licensing of every file in the repository, in one place (https://reuse.software).
# Check with: reuse lint   (or the check_reuse build target)
#
# The first entry covers everything. Later entries override it for third-party files: when
# several entries match a path, the last one wins.

version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Dennis Oberst"
SPDX-License-Identifier = "MIT-0"

[[annotations]]
path = ["src/controls/fonts/InterVariable.ttf", "src/controls/fonts/LICENSE.txt"]
SPDX-FileCopyrightText = "2016 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Lucide icons; the ones derived from Feather also carry Feather's MIT license.
[[annotations]]
path = [
    "src/controls/icons/eraser.svg",
    "src/controls/icons/copy.svg",
    "src/controls/icons/languages.svg",
    "src/controls/icons/pencil.svg",
    "src/controls/icons/redo-2.svg",
    "src/controls/icons/undo-2.svg",
]
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"

[[annotations]]
path = [
    "src/controls/icons/arrow-left.svg",
    "src/controls/icons/info.svg",
    "src/controls/icons/plus.svg",
    "src/controls/icons/trash.svg",
    "src/controls/icons/LICENSE",
]
SPDX-FileCopyrightText = ["2026 Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"

# The GPL and LGPL texts shipped with the application, as Qt's LGPLv3 license requires.
[[annotations]]
path = ["cmake/licenses/GPL-3.0-only.txt", "cmake/licenses/LGPL-3.0-only.txt"]
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "LicenseRef-FSF-verbatim"
