; Any qmllint warning fails the all_qmllint target. On top of the defaults, these
; categories are opt-in in Qt 6.12.
[General]
MaxWarnings=0

[Warnings]
UnusedImports=warning
FunctionUsedBeforeDeclaration=warning
AttachedPropertyReuse=warning
Quick.AttachedPropertyReuse=warning
Quick.ControlsAttachedPropertyReuse=warning
