name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths-ignore: ["docs/**", ".github/workflows/docs.yml"]

env:
  QT_VERSION: "6.12.0"
  # aqtinstall 3.3.0 cannot read the Qt 6.12 repository layout yet. Remove this pin once a
  # release includes https://github.com/miurahr/aqtinstall/pull/1048.
  AQT_SOURCE: "git+https://github.com/jdpurcell/aqtinstall.git@6f0f842da47c744cdc814cd94da9828d934d7bf0"
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Qt 6.12's QML asset downloader needs TaskTree; without it every configure warns.
          modules: qttasktree
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          pipx install clang-format "reuse[charset-normalizer]"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Key the vcpkg cache on the pinned vcpkg commit
        id: vcpkg
        shell: bash
        run: echo "commit=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/**/*.cmake') }}
          restore-keys: vcpkg-${{ matrix.os }}-

      - name: Configure, build, test and package
        run: cmake --workflow --preset release

      - name: Format, qmllint and REUSE
        if: runner.os == 'Linux'
        run: cmake --build --preset release --target check

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: |
            build/release/*.dmg
            build/release/*.zip
            build/release/*.tar.gz
