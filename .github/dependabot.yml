version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Moving the vcpkg submodule updates every vcpkg dependency at once.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
