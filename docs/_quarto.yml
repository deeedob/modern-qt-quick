project:
  type: book
  output-dir: _book

book:
  title: "Modern Qt Quick Applications"
  subtitle: "The concepts behind building, testing and shipping a Qt Quick app"
  author: "Dennis Oberst"
  date: today
  site-url: https://deeedob.github.io/modern-qt-quick/
  repo-url: https://github.com/deeedob/modern-qt-quick
  repo-subdir: docs
  repo-branch: main
  repo-actions: [source, issue]
  downloads: [pdf]
  search: true
  output-file: modern-qt-quick-applications
  reader-mode: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - 01-shape.qmd
        - 02-layout.qmd
    - part: "Building"
      chapters:
        - 03-build.qmd
        - 04-dependencies.qmd
    - part: "Qt and QML"
      chapters:
        - 05-qt-runtime.qmd
        - 06-qml.qmd
        - 07-cpp-qml.qmd
        - 08-patterns.qmd
    - part: "The application"
      chapters:
        - 09-look-and-feel.qmd
        - 10-essentials.qmd
    - part: "Quality"
      chapters:
        - 11-quality.qmd
        - 12-testing.qmd
    - part: "Shipping"
      chapters:
        - 13-shipping.qmd
        - 14-distribution.qmd
        - 15-mobile.qmd
    - part: "Beyond"
      chapters:
        - 16-learning.qmd

filters:
  - repo-links.lua
  - typst.lua

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss, dark.scss]
    toc: true
    toc-depth: 2
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    code-annotations: below
    highlight-style: github
    link-external-newwindow: true
    fig-align: center
  typst:
    template-partials:
      - typst-show.typ
    mermaid:
      theme: neutral
    papersize: a4
    margin:
      x: 2.2cm
      y: 2.4cm
    fontsize: 10.5pt
    toc: true
    toc-depth: 2
    number-depth: 2
    code-annotations: below
    include-in-header:
      text: |
        #show raw.where(block: true): set par(justify: false)
